<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{Title}} — админка</title>
    <link rel="stylesheet" href="/Static/css/admin.css">
    <base target="_blank">
</head>
<body>
<main class="admin-shell">
    <h1>{{Title}}</h1>

    <nav class="admin-actions">
        <a href="/admin">Главная админки</a>
        <a href="{{BasePath}}/create">Создать запись</a>
    </nav>

    <p>Всего записей: {{Count}}</p>

    <div class="admin-table-wrapper">
        <table class="admin-table">
            <thead>
            <tr>
                <th scope="col">Код</th>
                <th scope="col">Название</th>
                <th scope="col">Описание</th>
                <th scope="col">Действия</th>
            </tr>
            </thead>
            <tbody>
            {{#each Items}}
            <tr>
                <td>{{Code}}</td>
                <td>{{Name}}</td>
                <td>{{Description}}</td>
                <td>
                    <div class="admin-actions">
                        <a href="{{BasePath}}/edit?id={{Id}}">Изменить</a>
                        <a href="{{BasePath}}/delete?id={{Id}}">Удалить</a>
                    </div>
                </td>
            </tr>
            {{/each}}
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
